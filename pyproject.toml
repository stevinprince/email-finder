[project]
name = "email-finder"
version = "0.1.0"
description = "Find and verify professional email addresses for a person at a company"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "dnspython>=2.8.0",
    "nameparser>=2.3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
email-finder = "email_finder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
